<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Duel of the Seven Crowns: a seven-pointed crown over a 7x7 board -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f2a47"/>
      <stop offset="1" stop-color="#090d18"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a8"/>
      <stop offset="0.45" stop-color="#e2b65a"/>
      <stop offset="1" stop-color="#a87a2a"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3cc"/>
      <stop offset="1" stop-color="#8a6320"/>
    </linearGradient>
    <radialGradient id="ruby" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ff9aa8"/>
      <stop offset="0.5" stop-color="#e0294a"/>
      <stop offset="1" stop-color="#7a0f22"/>
    </radialGradient>
    <radialGradient id="sapphire" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b9d4ff"/>
      <stop offset="0.5" stop-color="#3f7bf0"/>
      <stop offset="1" stop-color="#16327a"/>
    </radialGradient>
    <radialGradient id="pearl" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f3e3b6"/>
      <stop offset="1" stop-color="#b8924a"/>
    </radialGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- Faint 7x7 checkerboard -->
  <g clip-path="url(#tile)" opacity="0.13" fill="#e2b65a">
    <rect x="23" y="23" width="30" height="30"/><rect x="83" y="23" width="30" height="30"/><rect x="143" y="23" width="30" height="30"/><rect x="203" y="23" width="30" height="30"/>
    <rect x="53" y="53" width="30" height="30"/><rect x="113" y="53" width="30" height="30"/><rect x="173" y="53" width="30" height="30"/>
    <rect x="23" y="83" width="30" height="30"/><rect x="83" y="83" width="30" height="30"/><rect x="143" y="83" width="30" height="30"/><rect x="203" y="83" width="30" height="30"/>
    <rect x="53" y="113" width="30" height="30"/><rect x="113" y="113" width="30" height="30"/><rect x="173" y="113" width="30" height="30"/>
    <rect x="23" y="143" width="30" height="30"/><rect x="83" y="143" width="30" height="30"/><rect x="143" y="143" width="30" height="30"/><rect x="203" y="143" width="30" height="30"/>
    <rect x="53" y="173" width="30" height="30"/><rect x="113" y="173" width="30" height="30"/><rect x="173" y="173" width="30" height="30"/>
    <rect x="23" y="203" width="30" height="30"/><rect x="83" y="203" width="30" height="30"/><rect x="143" y="203" width="30" height="30"/><rect x="203" y="203" width="30" height="30"/>
  </g>

  <!-- Soft glow behind the crown -->
  <ellipse cx="128" cy="140" rx="92" ry="62" fill="#e2b65a" opacity="0.10"/>

  <!-- Crown: seven points -->
  <path d="M46 176 L40 92 L68 132 L80 76 L100 124 L128 60 L156 124 L176 76 L188 132 L216 92 L210 176 Z"
        fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M68 132 L74 170 M100 124 L104 170 M156 124 L152 170 M188 132 L182 170"
        stroke="#9c7426" stroke-width="2" opacity="0.45" fill="none" stroke-linecap="round"/>

  <!-- Band -->
  <rect x="42" y="168" width="172" height="30" rx="8" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="3"/>
  <rect x="50" y="174" width="156" height="4" rx="2" fill="#fff3cc" opacity="0.55"/>

  <!-- Seven pearls, one on each point -->
  <circle cx="40" cy="90" r="9" fill="url(#pearl)"/>
  <circle cx="68" cy="128" r="6" fill="url(#pearl)"/>
  <circle cx="80" cy="74" r="9" fill="url(#pearl)"/>
  <circle cx="128" cy="56" r="11" fill="url(#pearl)"/>
  <circle cx="176" cy="74" r="9" fill="url(#pearl)"/>
  <circle cx="188" cy="128" r="6" fill="url(#pearl)"/>
  <circle cx="216" cy="90" r="9" fill="url(#pearl)"/>

  <!-- Jewels on the band -->
  <ellipse cx="128" cy="183" rx="13" ry="10" fill="url(#ruby)" stroke="#5c0a18" stroke-width="1.5"/>
  <ellipse cx="88" cy="183" rx="8" ry="6.5" fill="url(#sapphire)" stroke="#102456" stroke-width="1.2"/>
  <ellipse cx="168" cy="183" rx="8" ry="6.5" fill="url(#sapphire)" stroke="#102456" stroke-width="1.2"/>
  <circle cx="60" cy="183" r="4" fill="#fff3cc" opacity="0.8"/>
  <circle cx="196" cy="183" r="4" fill="#fff3cc" opacity="0.8"/>
  <circle cx="124" cy="179" r="3" fill="#ffffff" opacity="0.7"/>
</svg>
