# Duel of the Seven Crowns for Fairy-Stockfish
# Board: 7x7. Engine row r = rank r+1 (White starts on rank 1), col c = file a+c.
[sevencrowns]
maxRank = 7
maxFile = g
king = k
knight = n
# Cardinal: bishop slider + one orthogonal step
customPiece1 = c:BW
# Paladin: camel (3,1) leap + one orthogonal step
customPiece2 = e:CW
# Marshal: rook + knight
customPiece3 = m:RN
# Donkey: moves 1 diagonally forward to an empty square, captures 1 straight forward
customPiece4 = d:mfFcfW
# Lancer: leaps to any square exactly 2 away (dabbaba + knight + alfil)
customPiece5 = l:DNA
# Warden: wazir + ferz + dabbaba leaps
customPiece6 = w:WFD
promotionPawnTypes = d
promotionPieceTypes = l
promotionRegionWhite = *7
promotionRegionBlack = *1
mandatoryPawnPromotion = true
doubleStep = false
castling = false
# No stalemate: having no legal moves loses
stalemateValue = loss
# 40 plies without capture/promotion = draw; ordinary donkey moves don't reset it
nMoveRule = 20
nMoveRuleTypes = -
nFoldRule = 3
startFen = cnekwnm/ddddddd/7/7/7/DDDDDDD/CNEKWNM w - - 0 1
